<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Checkout produk digital Pinnly Store." />
  <title>Checkout — Pinnly Store</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="checkout">
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <header class="site-header">
    <nav class="navbar container">
      <a class="brand" href="../index.html" aria-label="Pinnly Store Home">
        <img src="../assets/logo.png" class="brand-logo-img" alt="Pinnly Store Logo" />
        <span><strong>Pinnly</strong><small>Store</small></span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Buka menu">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="../index.html" data-nav="home">Home</a>
        <a href="./produk.html" data-nav="products">Produk</a>
        <a href="./kontak.html" data-nav="contact">Kontak</a>
      </div>
    </nav>
  </header>

  <main class="container page-shell">
    <a class="back-link" href="./produk.html">← Pilih produk lain</a>

    <section class="checkout-layout reveal">
      <aside class="glass-card checkout-summary" id="checkoutProductCard">
        <div class="skeleton-card mini"></div>
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line short"></div>
      </aside>

      <form class="glass-card checkout-form" id="checkoutForm">
        <p class="eyebrow">Checkout</p>
        <h1>Lengkapi data pembeli</h1>
        <p class="form-note">Pesanan akan disimpan ke collection <code>orders</code> dengan status default <strong>Pending</strong>.</p>

        <label class="input-group">
          <span>Nama pembeli</span>
          <input id="buyerName" name="buyerName" type="text" placeholder="Masukkan nama kamu" required minlength="2" />
        </label>

        <label class="input-group">
          <span>Kontak pembeli</span>
          <input id="buyerContact" name="buyerContact" type="text" placeholder="WhatsApp / Telegram / Email" required minlength="5" />
        </label>

        <label class="input-group">
          <span>Metode pembayaran</span>
          <select id="paymentMethod" name="paymentMethod" required>
            <option value="QRIS">QRIS</option>
            <option value="DANA">DANA</option>
            <option value="OVO">OVO</option>
            <option value="GoPay">GoPay</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
        </label>

        <button class="btn btn-primary full" id="checkoutSubmit" type="submit">Buat Pesanan</button>
        <p class="message" id="checkoutMessage" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="yearNow"></span> Pinnly Store.</p>
      <p>Checkout aman via Firestore.</p>
    </div>
  </footer>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
