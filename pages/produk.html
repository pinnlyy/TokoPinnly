<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Katalog produk digital Pinnly Store." />
  <title>Produk — Pinnly Store</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="products">
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <header class="site-header">
    <nav class="navbar container">
      <a class="brand" href="../index.html" aria-label="Pinnly Store Home">
        <img src="../assets/logo.png" class="brand-logo-img" alt="Pinnly Store Logo" />
        <span><strong>Pinnly</strong><small>Store</small></span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Buka menu">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="../index.html" data-nav="home">Home</a>
        <a href="./produk.html" data-nav="products">Produk</a>
        <a href="./kontak.html" data-nav="contact">Kontak</a>
      </div>
    </nav>
  </header>

  <main class="container page-shell">
    <section class="page-hero glass-card reveal">
      <p class="eyebrow">Katalog Produk</p>
      <h1>Temukan produk digital yang kamu butuhkan.</h1>
      <p>Search, filter kategori, dan sort harga langsung dari data Firestore.</p>
    </section>

    <section class="toolbar glass-card reveal delay-1" aria-label="Filter produk">
      <label class="input-group">
        <span>Cari produk</span>
        <input id="searchInput" type="search" placeholder="Contoh: bot, script, panel..." autocomplete="off" />
      </label>
      <label class="input-group">
        <span>Kategori</span>
        <select id="categoryFilter">
          <option value="all">Semua kategori</option>
        </select>
      </label>
      <label class="input-group">
        <span>Urutkan</span>
        <select id="sortSelect">
          <option value="newest">Terbaru</option>
          <option value="price-asc">Harga terendah</option>
          <option value="price-desc">Harga tertinggi</option>
          <option value="name-asc">Nama A-Z</option>
        </select>
      </label>
    </section>

    <div class="result-meta reveal delay-2">
      <p id="productCounter">Memuat produk...</p>
      <button class="btn btn-ghost" id="resetFilterBtn" type="button">Reset filter</button>
    </div>

    <section class="product-grid reveal delay-2" id="productGrid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="yearNow"></span> Pinnly Store.</p>
      <p>Produk digital siap order.</p>
    </div>
  </footer>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
