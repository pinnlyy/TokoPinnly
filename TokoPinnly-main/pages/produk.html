<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Katalog produk digital Pinnly Store." />
  <title>Produk — Pinnly Store</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="products">
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <header class="site-header">
    <nav class="navbar container">
      <a class="brand" href="../index.html" aria-label="Pinnly Store Home">
        <img src="../assets/logo.png" class="brand-logo-img" alt="Pinnly Store Logo" />
        <span><strong>Pinnly</strong><small>Store</small></span>
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Buka menu">☰</button>
      <div class="nav-links" id="navLinks">
        <a href="../index.html" data-nav="home">Home</a>
        <a href="./produk.html" data-nav="products">Produk</a>
        <a href="./kontak.html" data-nav="contact">Kontak</a>
      </div>
    </nav>
  </header>

  <main class="container page-shell">
    <section class="page-hero product-quick-hero glass-card reveal">
      <p class="eyebrow">Katalog Produk</p>
      <h1>Produk digital siap order.</h1>
      <p>Cari cepat, pilih kategori, lalu checkout tanpa tampilan ribet.</p>
    </section>

    <section class="product-filter-card glass-card reveal delay-1" aria-label="Filter produk">
      <div class="search-shell">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Cari bot, nokos, panel..." autocomplete="off" />
        <button class="mini-reset" id="resetFilterBtn" type="button">Reset</button>
      </div>

      <div class="filter-block">
        <div class="filter-title">Kategori</div>
        <div class="filter-chips" id="categoryChips" role="list" aria-label="Pilih kategori">
          <button class="filter-chip active" type="button" data-category="all">Semua</button>
        </div>
      </div>

      <div class="filter-block sort-block">
        <div class="filter-title">Urutkan</div>
        <div class="filter-chips sort-chips" id="sortChips" role="list" aria-label="Urutkan produk">
          <button class="filter-chip active" type="button" data-sort="newest">Terbaru</button>
          <button class="filter-chip" type="button" data-sort="price-asc">Termurah</button>
          <button class="filter-chip" type="button" data-sort="price-desc">Termahal</button>
          <button class="filter-chip" type="button" data-sort="name-asc">A-Z</button>
        </div>
      </div>
    </section>

    <div class="result-meta product-result-meta reveal delay-2">
      <p id="productCounter">Memuat produk...</p>
    </div>

    <section class="product-grid reveal delay-2" id="productGrid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="yearNow"></span> Pinnly Store.</p>
      <p>Produk digital siap order.</p>
    </div>
  </footer>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
